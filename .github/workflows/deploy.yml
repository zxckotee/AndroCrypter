name: deploy

# Build debug APK and optionally copy to your server over SSH (manual or main push).

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload APK to SSH server
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core-*/**'
      - 'native/**'
      - 'gradle/**'
      - 'docker/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CI image and debug APK
        env:
          TEST_VOLUME_PASSWORD: ${{ secrets.TEST_VOLUME_PASSWORD }}
        run: |
          scripts/ci/docker/build-image.sh
          export HOST_UID=$(id -u) HOST_GID=$(id -g)
          docker compose run --rm android-ci-nokvm scripts/ci/build-debug-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hcvault-debug-apk-${{ github.run_id }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish to GitHub Actions artifact summary
        run: |
          apk=$(ls -1 artifacts/*.apk | head -1)
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$apk")\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-ssh:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hcvault-debug-apk-${{ github.run_id }}
          path: dist/

      - name: Assert deploy secrets
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "Missing secret SSH_HOST"; exit 1; }
          test -n "${{ secrets.SSH_USER }}" || { echo "Missing secret SSH_USER"; exit 1; }
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || { echo "Missing secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Install SSH key
        run: |
          install -m 0700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            port="${{ secrets.SSH_PORT }}"
            port="${port:-22}"
            ssh-keyscan -p "$port" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Upload APK via SCP
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          port="${SSH_PORT:-22}"
          remote_dir="${DEPLOY_PATH:-/opt/hcvault/apk}"
          apk="$(ls -1 dist/*.apk | head -1)"
          name="hcvault-debug-${GITHUB_SHA::12}.apk"
          scp -P "$port" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$apk" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${remote_dir}/${name}"
          ssh -p "$port" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "ln -sf ${remote_dir}/${name} ${remote_dir}/hcvault-debug-latest.apk"
          echo "Deployed ${name}" >> "$GITHUB_STEP_SUMMARY"
